Wettbewerber, aktueller Lieferant":["e.g. competitor, current supplier","ad es. concorrente, fornitore attuale"],"– bitte wählen –":["– please select –","– selezionare –"],"„System“ folgt der Einstellung des Geräts.":["“System” follows the device setting.","“Sistema” segue l'impostazione del dispositivo."],"λ = Spanlänge im Schnitt / tatsächliche Spanlänge. Typisch 1,5–3 bei Stahl, ca. 1,2–1,8 bei Aluminium. Bestimmt die Spanlänge lsp = le / λ.":["λ = chip length in cut / actual chip length. Typically 1.5–3 for steel, approx. 1.2–1.8 for aluminium. Determines chip length lsp = le / λ.","λ = lunghezza di taglio / lunghezza effettiva del truciolo. Tipico 1,5–3 per acciaio, circa 1,2–1,8 per alluminio. Determina la lunghezza del truciolo lsp = le / λ."],"φs = 2 · sin⁻¹(ae / d1). Ein- und Austritt mit gleicher Spandicke.":["φs = 2 · sin⁻¹(ae / d1). Entry and exit with equal chip thickness.","φs = 2 · sin⁻¹(ae / d1). Entrata e uscita con uguale spessore del truciolo."],"φs = sin⁻¹((ae − d1/2) / (d1/2)) + 90°. Eintritt mit Spandicke, Austritt mit dünnem Span – in der Regel bevorzugt.":["φs = sin⁻¹((ae − d1/2) / (d1/2)) + 90°. Entry with chip thickness, exit with thin chip – usually preferred.","φs = sin⁻¹((ae − d1/2) / (d1/2)) + 90°. Entrata con spessore, uscita con truciolo sottile – di norma preferibile."],"φs = sin⁻¹((ae − d1/2) / (d1/2)) + 90°. Eintritt mit dünnem Span, Austritt mit Spandicke – Gefahr von Ausbrüchen und Kammrissen an der Schneide.":["φs = sin⁻¹((ae − d1/2) / (d1/2)) + 90°. Entry with thin chip, exit with chip thickness – risk of chipping and comb cracks on the edge.","φs = sin⁻¹((ae − d1/2) / (d1/2)) + 90°. Entrata con truciolo sottile, uscita con spessore – rischio di scheggiature e cricche a pettine."],"φs = φ1 + φ2 mit sin φ1 = 2·(d1/2 − aüe)/d1 und sin φ2 = 2·(ae − ae1)/d1, ae1 = d1/2 − aüe. aüe = Überstand des Fräsers auf der Gleichlaufseite.":["φs = φ1 + φ2 with sin φ1 = 2·(d1/2 − aüe)/d1 and sin φ2 = 2·(ae − ae1)/d1, ae1 = d1/2 − aüe. aüe = cutter overhang on the down-milling side.","φs = φ1 + φ2 con sin φ1 = 2·(d1/2 − aüe)/d1 e sin φ2 = 2·(ae − ae1)/d1, ae1 = d1/2 − aüe. aüe = sporgenza della fresa sul lato concorde."],"Q, Pc und Kräfte aus dem Schnittkraftrechner":["Q, Pc and forces from the cutting force calculator","Q, Pc e forze dal calcolatore"],Gegenlauf:["Up milling","Discorde"],Gleichlauf:["Down milling","Concorde"],Sprache:["Language","Lingua"],Allgemein:["General","Generale"],"Allgemein (kein Parametersatz)":["General (no parameter set)","Generale (nessun set)"],Beschreibung:["Description","Descrizione"],"Beschreibung, z. B. Freifläche nach 70 Stk.":["Description, e.g. flank after 70 pcs","Descrizione, ad es. fianco dopo 70 pz."],Zuordnung:["Assignment","Assegnazione"],Entfernen:["Remove","Rimuovi"],"Wirklich entfernen?":["Really remove?","Rimuovere davvero?"],"Wirklich löschen?":["Really delete?","Eliminare davvero?"],"Wirklich alles leeren?":["Really clear everything?","Svuotare davvero tutto?"],"Wirklich alles löschen?":["Really delete everything?","Eliminare davvero tutto?"],"Dieser Browser kann Medien nicht dauerhaft speichern. Bericht vor dem Schließen speichern.":["This browser cannot store media permanently. Save the report before closing.","Questo browser non può salvare i media in modo permanente. Salvare il rapporto prima di chiudere."],"Versuchsbericht Zerspanung":["Machining test report","Rapporto di prova lavorazione"],"Kundendaten im Reiter „Versuch“ eintragen.":["Enter customer data in the “Test” tab.","Inserire i dati cliente nella scheda “Prova”."],"Keine Parametersätze gespeichert.":["No parameter sets saved.","Nessun set di parametri salvato."],"Keine Werkzeugdaten":["No tool data","Nessun dato utensile"],"„Bericht speichern & teilen“ erzeugt eine HTML-Datei mit dem fertigen Bericht und allen Versuchsdaten. In der Claude-App am iPhone öffnet sich das Teilen-Menü (z. B. Teams), sonst landet die Datei im Download-Ordner. Über „Gespeicherte Datei öffnen“ lässt sich der Versuch
